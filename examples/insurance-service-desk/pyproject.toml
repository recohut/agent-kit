[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-service-desk"
version = "0.1.0"
description = "Synthetic read-only insurance service desk. The model chooses a lane. The host owns the customer, the refusal, and the citation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai]>=2.45,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
