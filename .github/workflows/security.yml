name: Repository safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-safety:
    name: release-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python .github/policy/check_files.py
      - run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files > "$RUNNER_TEMP/secret-scan.json"
          python -c 'import json, sys; findings=json.load(open(sys.argv[1]))["results"]; sys.exit("Potential secrets in: " + ", ".join(findings) if findings else 0)' "$RUNNER_TEMP/secret-scan.json"
      - run: python -m examples.hello_agent.main
